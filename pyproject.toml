[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mosamiat"
version = "0.1.0"
description = "Weather and air-quality forecasting for Islamabad"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
]

[project.scripts]
mosamiat-collect = "mosamiat.collect:main"
mosamiat-backfill = "mosamiat.backfill:main"
mosamiat-store = "mosamiat.storage:main"
mosamiat-features = "mosamiat.features.pipeline:main"
mosamiat-eda = "mosamiat.eda.pipeline:main"
mosamiat-baseline = "mosamiat.modeling.evaluate:main"
mosamiat-statistical = "mosamiat.modeling.statistical:main"
mosamiat-classical = "mosamiat.modeling.classical:main"
mosamiat-lstm = "mosamiat.modeling.deep_learning:main"

[project.optional-dependencies]
deep-learning = ["torch>=2.6,<3"]
analysis = [
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "ipykernel>=6.29,<8",
]
storage = [
    "hopsworks[python]>=4.8,<4.9",
    "python-dotenv>=1,<2",
]
modeling = [
    "joblib>=1.4,<2",
    "scikit-learn>=1.6,<1.9",
    "statsmodels>=0.14.4,<0.15",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
cache-dir = ".cache/uv"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
