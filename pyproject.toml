[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mosamiat"
version = "0.1.0"
description = "Weather and air-quality forecasting for Islamabad"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pandas>=2.2,<3",
]

[project.scripts]
mosamiat-collect = "mosamiat.collect:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
cache-dir = ".cache/uv"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
